name: Ops read BR-1A status

on:
  push:
    branches:
      - ops/read-br1a-status
    paths:
      - .github/workflows/ops-read-br1a-status.yml

permissions:
  contents: read

jobs:
  read-status:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read production status and recent backend logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/local-price-checks
          echo 'ENV_SCHEDULER:'
          grep '^SCHEDULER_ENABLED=' .env || true
          grep '^COLLECTOR_TIMEOUT_SECONDS=' .env || true
          echo 'HEALTH:'
          curl -fsS http://127.0.0.1:8083/health || true
          echo
          echo 'DB_STATUS:'
          docker compose exec -T app python - <<'PY'
          from datetime import datetime
          from app.db import SessionLocal
          from app.data_operations_models import DailyCollectionRun, PriceObservation, SourceProduct
          from app.models import CollectionRun, Store
          db = SessionLocal()
          try:
              daily = db.query(DailyCollectionRun).order_by(DailyCollectionRun.started_at.desc()).first()
              print('daily=', None if daily is None else {
                  'run_date': str(daily.run_date), 'status': daily.status,
                  'started_at': str(daily.started_at), 'finished_at': str(daily.finished_at),
                  'planned': daily.stores_planned, 'succeeded': daily.stores_succeeded,
                  'failed': daily.stores_failed, 'blocked': daily.stores_blocked,
                  'offers_observed': daily.offers_observed,
                  'price_observations': daily.price_observations,
                  'warnings': daily.warnings_json, 'blockers': daily.blockers_json,
              })
              print('price_observations_total=', db.query(PriceObservation).count())
              print('source_products_total=', db.query(SourceProduct).count())
              latest = db.query(CollectionRun, Store).join(Store, Store.id == CollectionRun.store_id).order_by(CollectionRun.started_at.desc()).limit(15).all()
              for run, store in latest:
                  age = None
                  if run.started_at:
                      age = (datetime.utcnow() - run.started_at).total_seconds()
                  print('run=', {
                      'id': run.id, 'store': f'{store.retailer} | {store.name}',
                      'status': run.status, 'started_at': str(run.started_at),
                      'age_seconds': age, 'received': run.offers_received,
                      'imported': run.offers_imported, 'message': run.message,
                  })
          finally:
              db.close()
          PY
          echo 'APP_LOGS_LAST_10M:'
          docker compose logs --since=10m --tail=250 app || true
          REMOTE
