name: CI
on:
  push:
    branches:
      - main
      - fix/spareno-png-browser-compat
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lokero
          POSTGRES_USER: lokero
          POSTGRES_PASSWORD: lokero_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lokero -d lokero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .
      POSTGRES_TEST_URL: postgresql+psycopg://lokero:lokero_ci_only@127.0.0.1:5432/lokero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_postgres_readiness.py -m postgres
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-lovable-source
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate canonical Spareno icon family
        run: |
          test -f public/brand/spareno-icon-192.png
          test -f public/brand/spareno-icon-512.png
          test -f public/brand/spareno-maskable-512.png
          test -f public/brand/apple-touch-icon.png
          test -f public/brand/favicon-32.png
      - name: Production frontend build
        run: bun run build
      - name: Frontend lint (advisory)
        continue-on-error: true
        run: bun run lint
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
