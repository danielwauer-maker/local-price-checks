name: Sync Lovable source snapshot

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Apply reviewed Lovable changes to the protected frontend snapshot'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Lovable source safely
        if: ${{ inputs.apply_changes != true }}
        run: ./scripts/sync-lovable-source.sh

      - name: Apply explicitly approved Lovable sync
        if: ${{ inputs.apply_changes == true }}
        run: ./scripts/sync-lovable-source.sh --apply

      - name: Commit snapshot if changed
        if: ${{ inputs.apply_changes == true }}
        run: |
          if git diff --quiet -- frontend-lovable-source; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-lovable-source
          git commit -m "Sync explicitly approved Lovable frontend snapshot"
          git push origin HEAD:main
