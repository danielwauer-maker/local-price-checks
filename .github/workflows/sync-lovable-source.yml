name: Sync Lovable source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lovable-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Lovable source
        run: ./scripts/sync-lovable-source.sh

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- frontend-lovable-source; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-lovable-source
          git commit -m "Sync merged Lovable frontend snapshot"
          git push origin HEAD:main
