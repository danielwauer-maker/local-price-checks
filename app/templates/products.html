{% extends 'base.html' %}{% block content %}<h1>Produkte suchen</h1><form method="get"><input name="q" value="{{ q }}" placeholder="Produktname"><button>Suchen</button></form>{% for p in products %}<article><b>{{ p.name }}</b><small>{{ p.brand or '' }} {{ p.package_size or '' }}</small><div class="actions"><form method="post" action="/favoriten/{{ p.id }}/toggle"><input type="hidden" name="next_url" value="/produkte?q={{ q }}"><button>{% if p.id in fav_ids %}★ Favorit entfernen{% else %}☆ Als Favorit{% endif %}</button></form><form method="post" action="/einkauf/{{ p.id }}/add"><button>+ Einkaufsliste</button></form></div></article>{% else %}<p class="muted">Keine Produkte gefunden.</p>{% endfor %}{% endblock %}
