<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#147b49">
  <title>{% block title %}LocalPrices{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">{% block content %}{% endblock %}</main>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a class="nav-item {{ 'active' if request.url.path == '/' else '' }}" href="/"><span class="nav-icon">⌂</span><span>Start</span></a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/maerkte') else '' }}" href="/maerkte"><span class="nav-icon">⌖</span><span>Märkte</span></a>
      <a class="nav-scan {{ 'active' if request.url.path.startswith('/scanner') else '' }}" href="/scanner" aria-label="Scanner"><span>⌗</span></a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/einkauf') or request.url.path.startswith('/sparplan') else '' }}" href="/einkauf"><span class="nav-icon">☷</span><span>Liste</span></a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/angebote') else '' }}" href="/angebote"><span class="nav-icon">◇</span><span>Angebote</span></a>
    </nav>
  </div>
</body>
</html>
