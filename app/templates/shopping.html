{% extends 'base.html' %}{% block content %}<h1>Einkaufsliste</h1><div class="actions"><a href="/produkte">Produkt hinzufügen</a><a href="/scanner">Barcode scannen</a></div>{% for row in rows %}<article><b>{{ row.product.name }}</b><form method="post" action="/einkauf/{{ row.id }}/update"><label>Menge <input type="number" name="quantity" min="0" max="999" step="1" value="{{ row.quantity }}"></label><button>Aktualisieren</button></form><form method="post" action="/einkauf/{{ row.id }}/delete"><button>Entfernen</button></form></article>{% else %}<p class="muted">Deine Einkaufsliste ist leer.</p>{% endfor %}{% if rows %}<div class="actions"><a class="primary" href="/sparplan">Sparplan erstellen</a><form method="post" action="/einkauf/clear"><button>Liste leeren</button></form></div>{% endif %}{% endblock %}
