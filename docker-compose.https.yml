services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      LOCAL_HOST: ${LOCAL_HOST:-localhost}
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
