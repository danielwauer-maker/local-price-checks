services:
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lokero}
      POSTGRES_USER: ${POSTGRES_USER:-lokero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokero_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lokero-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-lovable-source
      dockerfile: Dockerfile.server
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./deploy/localprices-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  lokero-postgres-data:
